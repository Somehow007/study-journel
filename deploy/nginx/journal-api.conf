# 学习手帐 Go API（M4 切换用）
# 把下面 location 块加入 mysite.conf 的 443 与 8080 两个 server 块内，
# 位置在 `location /journal/` 静态块之前（最长前缀匹配，顺序其实无关，
# 但放一起便于阅读）。加完 `sudo nginx -t && sudo systemctl reload nginx`。
#
# 映射：/journal/api/v1/* → 127.0.0.1:8090/api/v1/*（Go chi 路由前缀 /api）
# 回滚：删除本块并 reload 即恢复旧链路（旧前端走 /api/journal → 8081 不受影响）。

location /journal/api/ {
    proxy_pass http://127.0.0.1:8090/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 4m;
}
