<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/book.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>学习手帐</title>
    <meta name="theme-color" content="#F3F1EA" />
  </head>
  <body>
    <script>
      ;(function () {
        var t = localStorage.getItem('study-journal-theme') || 'notebook'
        if (t !== 'notebook' && t !== 'notebook-dark') t = 'notebook'
        document.documentElement.setAttribute('data-theme', 'journal-' + t)
        var d = t === 'notebook-dark'
        document.documentElement.classList.toggle('dark', d)
        document.documentElement.style.colorScheme = d ? 'dark' : 'light'
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
